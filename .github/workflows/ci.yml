# Runs the backend tests and the frontend type check, lint and build on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # Vercel's Python runtime
          cache: pip
          cache-dependency-path: api/requirements.txt
      # The same packages production installs (api/requirements.txt), plus pytest
      - run: pip install -r ../api/requirements.txt "pytest>=8,<9"
      # Tests use an in-memory database and block network calls; no secrets are needed
      - run: python -m pytest

  frontend:
    name: Frontend type check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm run build  # tsc -b, then vite build
